services:
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile.dev
    security_opt:
      - apparmor:unconfined

    ports:
      - "3000:3000"
#    volumes:
#      - ./ui:/app                        # hot-reload: sync local files into container
#      - /app/node_modules             # keep container's node_modules untouched
    environment:
      - CHOKIDAR_USEPOLLING=true      # needed for hot-reload on some OS (Windows/WSL)
      - WATCHPACK_POLLING=true        # needed for Webpack 5 / CRA
    stdin_open: true                  # keeps process alive (needed for CRA)


  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    security_opt:
      - apparmor:unconfined
    ports:
      - "8001:8001"
#    volumes:
#      - ./api:/app                  # hot-reload: sync local files into container
#      - /app/.venv              # keep container's virtualenv untouched
    environment:
      - ENV=development
#    env_file:
#      - .env                    # optional: load your local .env file
    command: uv run fastapi dev app/main.py --host 0.0.0.0 --port 8001