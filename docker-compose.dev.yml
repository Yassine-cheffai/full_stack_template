services:
  user-ui:
    build:
      context: ./user-ui
      dockerfile: Dockerfile.dev
    security_opt:
      - apparmor:unconfined

    ports:
      - "5173:5173"

    develop:
      watch:
        - action: sync
          path: ./user-ui/src
          target: /app/src

        - action: sync
          path: ./user-ui/public
          target: /app/public

        #        - action: sync+restart
        #          path: ./user-ui/vite.config.js
        #
        #        - action: sync+restart
        #          path: ./user-ui/.env

        - action: rebuild
          path: ./user-ui/package.json

    environment:
      - CHOKIDAR_USEPOLLING=true      # needed for hot-reload on some OS (Windows/WSL)
      - WATCHPACK_POLLING=true        # needed for Webpack 5 / CRA
    stdin_open: true                  # keeps process alive (needed for CRA)


  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    security_opt:
      - apparmor:unconfined
    ports:
      - "8001:8001"

    develop:
      watch:
        - action: sync
          path: ./api
          target: /app
          ignore:
            - __pycache__/
        - action: rebuild
          path: ./api/pyproject.toml


    environment:
      - ENV=development
      - DATABASE_URL=sqlite:///./test.db
    command: uv run fastapi dev app/main.py --host 0.0.0.0 --port 8001
    stdin_open: true
